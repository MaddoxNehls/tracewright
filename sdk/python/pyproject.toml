[project]
name = "tracewright"
version = "0.1.0"
description = "Python SDK for Tracewright, a flight recorder for AI agents."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "anthropic>=2.3.0",
    "openai>=3.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "RET"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
