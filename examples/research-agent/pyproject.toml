[project]
name = "research-agent"
version = "0.1.0"
description = "A small tool-using research agent that generates Tracewright traces."
requires-python = ">=3.10"
dependencies = [
    "tracewright",
    "anthropic>=2.3",
    "openai>=3.40",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.uv.sources]
tracewright = { path = "../../sdk/python", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
follow_imports = "skip"
