name: Tracewright agent eval
description: >-
  Run a Tracewright eval suite, compare it against a baseline, post the report as a single
  PR comment (updated in place on later pushes), and fail on regression.

inputs:
  suite:
    description: Suite YAML file, relative to working-directory.
    required: true
  baseline:
    description: Baseline results JSON to compare against, relative to working-directory.
    required: true
  thresholds:
    description: Thresholds YAML. Without one, any newly failing task is a regression.
    required: false
    default: ''
  working-directory:
    description: Directory to run in, usually the agent project's root.
    required: false
    default: .
  command:
    description: >-
      How to invoke the tracewright CLI in that directory, e.g. "uv run tracewright" or
      "poetry run tracewright". The tracewright package must already be installed there.
    required: false
    default: tracewright
  repeat:
    description: Runs per task; more than 1 exposes flaky tasks.
    required: false
    default: '1'
  dashboard-url:
    description: Dashboard base URL, to link each regressed task's runs side by side.
    required: false
    default: ''
  project:
    description: Tracewright project slug, used in dashboard links.
    required: false
    default: ''
  comment:
    description: Post or update the report as a PR comment ("true" or "false").
    required: false
    default: 'true'
  fail-on-regression:
    description: Fail the step when the comparison finds a regression ("true" or "false").
    required: false
    default: 'true'
  github-token:
    description: Token used to comment; needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  regression:
    description: '"true" if the current results regressed against the baseline.'
    value: ${{ steps.compare.outputs.regression }}
  results:
    description: Path of the results JSON from this run.
    value: ${{ steps.run.outputs.results }}
  report:
    description: Path of the markdown report.
    value: ${{ steps.compare.outputs.report }}

runs:
  using: composite
  steps:
    - name: Run eval suite
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        SUITE: ${{ inputs.suite }}
        REPEAT: ${{ inputs.repeat }}
      run: |
        out="$RUNNER_TEMP/tracewright-eval"
        mkdir -p "$out"
        # $COMMAND is intentionally unquoted: it may be several words ("uv run tracewright").
        $COMMAND eval run "$SUITE" --repeat "$REPEAT" --output "$out/results.json"
        echo "results=$out/results.json" >> "$GITHUB_OUTPUT"

    - name: Compare against baseline
      id: compare
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        BASELINE: ${{ inputs.baseline }}
        THRESHOLDS: ${{ inputs.thresholds }}
        RESULTS: ${{ steps.run.outputs.results }}
        TRACEWRIGHT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        TRACEWRIGHT_PROJECT: ${{ inputs.project }}
      run: |
        report="$RUNNER_TEMP/tracewright-eval/report.md"
        args=(eval compare --baseline "$BASELINE" --current "$RESULTS" --output "$report")
        if [ -n "$THRESHOLDS" ]; then args+=(--thresholds "$THRESHOLDS"); fi
        status=0
        $COMMAND "${args[@]}" || status=$?
        if [ "$status" -gt 1 ]; then exit "$status"; fi  # 2 means bad input, not a regression
        echo "regression=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request
      # Fork PRs get a read-only token; the job summary still has the report.
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        REPORT: ${{ steps.compare.outputs.report }}
        MARKER: '<!-- tracewright-agent-eval: ${{ inputs.working-directory }}/${{ inputs.suite }} -->'
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = process.env.MARKER;
          const body = `${marker}\n${fs.readFileSync(process.env.REPORT, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on regression
      if: steps.compare.outputs.regression == 'true' && inputs.fail-on-regression == 'true'
      shell: bash
      run: |
        echo "::error title=Agent eval regression::The eval suite regressed against the baseline; see the report in the job summary."
        exit 1
